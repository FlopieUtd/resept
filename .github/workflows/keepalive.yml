name: Supabase keepalive

# Supabase pauses free projects after 7 days of inactivity; ping every 3 days.
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        # Render's free tier cold-starts slowly, so allow retries and a long timeout.
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 30 --retry-all-errors --max-time 120 \
            "${BACKEND_URL:-https://resept-rb0j.onrender.com}/keepalive"
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
